
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080812">
<title>JARVIS AI - KOYEL</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #080812;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  text-align: center;
  font-size: 27px;
  font-weight: bold;
  letter-spacing: 4px;
  color: #ff3155;
  text-shadow: 0 0 15px #ff174d;
}

.status {
  text-align: center;
  color: #24aaff;
  font-size: 12px;
  letter-spacing: 2px;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.avatar {
  width: 190px;
  height: 190px;
  margin: 35px auto 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(circle, #182c59, #080812 70%);
  border: 3px solid #168bff;
  box-shadow: 0 0 25px #087cff, 0 0 45px #ff174d;
  animation: pulse 2.5s infinite alternate;
}

.avatar::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid #ff3155;
  animation: rotate 6s linear infinite;
}

.face {
  font-size: 75px;
  filter: drop-shadow(0 0 12px #168bff);
}

@keyframes pulse {
  to { transform: scale(1.04); }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

h2 {
  text-align: center;
  color: #ff3155;
}

.subtitle {
  text-align: center;
  color: #9bbaff;
  font-size: 14px;
}

.chat-box {
  margin-top: 30px;
  height: 260px;
  overflow-y: auto;
  border: 1px solid #263c72;
  border-radius: 15px;
  padding: 12px;
  background: #101020;
}

.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.user {
  background: #172d58;
  border-left: 3px solid #168bff;
}

.bot {
  background: #301321;
  border-left: 3px solid #ff3155;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

input {
  min-width: 0;
  flex: 1;
  padding: 14px;
  border-radius: 25px;
  border: 1px solid #168bff;
  background: #151526;
  color: white;
  outline: none;
}

button {
  cursor: pointer;
  border: none;
  color: white;
}

.send {
  padding: 12px 18px;
  border-radius: 25px;
  background: linear-gradient(120deg,#ff174d,#087cff);
}

#mic {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ff174d,#087cff);
  border: 2px solid #168bff;
  font-size: 27px;
  box-shadow: 0 0 20px #087cff;
}

.mic-area {
  text-align: center;
  margin-top: 22px;
}

#reply {
  text-align: center;
  color: #24aaff;
  font-size: 13px;
  margin: 12px;
}

.footer {
  text-align: center;
  color: #777;
  font-size: 11px;
  padding: 25px;
}
</style>
</head>

<body>

<header>J.A.R.V.I.S</header>
<div class="status">● SYSTEM ONLINE</div>

<main>

<div class="avatar">
  <div class="face">👩🏻</div>
</div>

<h2>HELLO, I'M KOYEL</h2>
<p class="subtitle">Your Personal AI Assistant</p>

<div class="chat-box" id="chat">
  <div class="message bot">
    নমস্কার! আমি KOYEL। তোমাকে কীভাবে সাহায্য করতে পারি?
  </div>
</div>

<div class="controls">
  <input id="message" placeholder="Ask KOYEL anything...">
  <button class="send" id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<div class="mic-area">
  <button id="mic" onclick="speak()">🎙️</button>
  <p class="subtitle">Tap to Speak</p>
</div>

<div id="reply">আমি তোমার কথা শোনার জন্য প্রস্তুত।</div>

</main>

<div class="footer">
  JARVIS AI • POWERED BY KOYEL
</div>

<script>

// BACKEND CONNECTION
const API_URL = "https://jarvis-ai-5-umud.onrender.com/api/chat";

let history = [];
let busy = false;

function addMessage(text, type) {
  const chat = document.getElementById("chat");
  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {

  if (busy) return;

  const input = document.getElementById("message");
  const reply = document.getElementById("reply");
  const sendBtn = document.getElementById("sendBtn");

  const msg = input.value.trim();

  if (!msg) return;

  addMessage(msg, "user");
  input.value = "";

  busy = true;
  sendBtn.disabled = true;
  reply.innerText = "KOYEL is thinking...";

  try {

    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: msg,
        history: history.slice(-10)
      })
    });

    if (!response.ok) {
      throw new Error("Server error: " + response.status);
    }

    const data = await response.json();

    const answer = data.reply || data.response || data.answer;

    if (!answer) {
      throw new Error("AI response পাওয়া যায়নি");
    }

    addMessage(answer, "bot");

    history.push(
      { role: "user", content: msg },
      { role: "assistant", content: answer }
    );

    reply.innerText = "● KOYEL ONLINE";

    speakReply(answer);

  } catch (error) {

    addMessage(
      "AI Brain সংযোগ করা যাচ্ছে না। আবার চেষ্টা করো।",
      "bot"
    );

    reply.innerText = "● CONNECTION ERROR";
    console.error(error);

  } finally {

    busy = false;
    sendBtn.disabled = false;

  }
}

document.getElementById("message")
.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});

function speak() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.getElementById("reply").innerText =
      "Voice Recognition এই Browser-এ পাওয়া যাচ্ছে না।";
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "bn-IN";
  recognition.interimResults = false;

  recognition.onstart = function() {
    document.getElementById("reply").innerText =
      "KOYEL is listening...";
  };

  recognition.onresult = function(event) {
    document.getElementById("message").value =
      event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = function() {
    document.getElementById("reply").innerText =
      "Microphone error. আবার চেষ্টা করো।";
  };

  recognition.start();
}

function speakReply(text) {

  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "bn-IN";
  speech.rate = 0.95;
  speech.pitch = 1.1;

  window.speechSynthesis.speak(speech);
}

</script>
</body>
</html>
