
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOYEL AI</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #080812;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  padding: 22px;
  color: #ff3155;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 3px;
}
.status {
  color: #28aaff;
  font-size: 13px;
}
.character {
  width: 190px;
  height: 190px;
  margin: 65px auto 25px;
  border-radius: 50%;
  border: 3px solid #168bff;
  box-shadow: 0 0 25px #087cff, 0 0 45px #ff174d;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 75px;
  animation: glow 2s infinite alternate;
}
@keyframes glow {
  from {box-shadow: 0 0 15px #087cff;}
  to {box-shadow: 0 0 35px #ff174d;}
}
h2 {
  color: #ff3155;
}
p {
  color: #9bbaff;
}
#mic {
  margin-top: 30px;
  width: 85px;
  height: 85px;
  border-radius: 50%;
  border: 2px solid #168bff;
  background: linear-gradient(135deg,#ff174d,#087cff);
  color: white;
  font-size: 32px;
}
input {
  width: 75%;
  padding: 14px;
  margin-top: 35px;
  border-radius: 25px;
  border: 1px solid #168bff;
  background: #151526;
  color: white;
}
button {
  cursor: pointer;
}
#reply {
  margin: 25px;
  color: white;
}
</style>
</head>

<body>

<header>KOYEL AI</header>
<div class="status">● SYSTEM ONLINE</div>

<div class="character">👩🏻</div>

<h2>Hello, I'm KOYEL</h2>
<p>Your Personal AI Assistant</p>

<input id="message" placeholder="Message KOYEL AI...">
<button onclick="sendMessage()">Send</button>

<br>

<button id="mic" onclick="speak()">🎙️</button>

<div id="reply">আমি তোমার কথা শোনার জন্য প্রস্তুত।</div>

<script>
function sendMessage() {
  let msg = document.getElementById("message").value;
  if (!msg.trim()) return;

  document.getElementById("reply").innerText =
    "তুমি বলেছ: " + msg +
    " | AI Brain এখনো সংযুক্ত হয়নি।";
}

function speak() {
  if (!("webkitSpeechRecognition" in window ||
        "SpeechRecognition" in window)) {
    document.getElementById("reply").innerText =
      "তোমার Browser-এ Voice Recognition পাওয়া যায়নি।";
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  let recognition = new SpeechRecognition();
  recognition.lang = "bn-IN";
  recognition.start();

  recognition.onresult = function(event) {
    document.getElementById("message").value =
      event.results[0][0].transcript;
    sendMessage();
  };
}
</script>

</body>
</html>
